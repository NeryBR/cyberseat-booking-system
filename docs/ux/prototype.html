<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111115">
  <meta name="description" content="CyberSeat interactive design prototype. Discover gaming clubs, choose a station and explore a simulated booking journey.">
  <title>CyberSeat — Find your next session</title>
  <link rel="stylesheet" href="prototype.css">
  <script defer src="prototype-model.js"></script>
  <script defer src="prototype.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" aria-label="Main navigation">
    <a href="#discover" class="brand" aria-label="CyberSeat home"><span class="brand-mark">C</span>cyberseat<span class="brand-period">.</span></a>
    <div class="workspace-label">YOUR NEXT LEVEL</div><nav id="desktop-nav"></nav>
    <div class="sidebar-bottom">
      <div class="squad-card"><span class="small-kicker">BETTER TOGETHER</span><div>Same squad.<br>Same place.</div><p>Find your spot. Your friends can book the seats next to you.</p><button class="text-button" data-action="discover">Explore clubs ↗</button></div>
      <button class="profile" data-action="guide"><span class="avatar">AL</span><span><strong>Alibi</strong><small>Demo visitor</small></span><span class="profile-dot" aria-hidden="true"></span></button>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button mobile-menu-button" data-action="mobile-menu" aria-label="Open navigation"><span data-icon="menu"></span></button>
      <div class="breadcrumb"><span>Play your way</span><span aria-hidden="true">/</span><strong id="breadcrumb-current">Discover</strong></div>
      <div class="topbar-right"><span class="location"><span data-icon="pin"></span>Astana <i></i></span><button class="demo-badge" data-action="guide"><i></i>Interactive demo ↗</button><button class="icon-button guide-button" data-action="guide" aria-label="Open prototype guide"><span data-icon="help"></span></button></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span><b>cyberseat.</b> Good games start here.</span><button class="text-button" data-action="guide">Design prototype · v2.0 ↗</button><span>Illustrative clubs & data · Asia/Almaty (UTC+05:00)</span></footer>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation" id="mobile-nav"></nav>
  <dialog id="booking-dialog" class="booking-dialog" aria-labelledby="booking-title"></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="navigation-dialog" class="navigation-dialog" aria-label="Navigation"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript-message">Enable JavaScript to explore this local interactive prototype. The earlier static screen collection is preserved as cyberseat-ux-prototype.png (version 1.1).</div></noscript>
</body>
</html>
