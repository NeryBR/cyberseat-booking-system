<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">CyberSeat Use Case Diagram</title>
<desc id="desc">Four actors interact with visitor booking and administration use cases inside the CyberSeat system boundary.</desc>
<defs><style>
.bg{fill:#f4f6fb}.boundary{fill:#fff;stroke:#5b4df5;stroke-width:3}.uc{fill:#f8f7ff;stroke:#6658e8;stroke-width:2}.admin{fill:#eef8f3;stroke:#27805d;stroke-width:2}.actor{stroke:#172033;stroke-width:3;fill:none}.line{stroke:#677085;stroke-width:2;fill:none}.dash{stroke:#916f00;stroke-width:2;stroke-dasharray:8 6;fill:none}.label{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#172033}.small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#475467}.tiny{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#6b5600}.title{font:800 34px 'Segoe UI',Arial,sans-serif;fill:#172033}.subtitle{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#667085}.role{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172033}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#916f00"/></marker></defs>
<rect class="bg" width="1600" height="1040"/><text class="title" x="60" y="52">CyberSeat — Use Case Diagram</text><text class="subtitle" x="60" y="82">Initial submission · ECR-11 · October 23, 2026</text>
<rect class="boundary" x="250" y="110" width="1100" height="850" rx="24"/><text class="label" x="280" y="148">CyberSeat system boundary</text>

<!-- actors -->
<g transform="translate(95 235)"><circle class="actor" cx="42" cy="24" r="18"/><path class="actor" d="M42 42v64M9 67h66M42 106L14 150M42 106l28 44"/><text class="role" x="42" y="180" text-anchor="middle">Guest</text></g>
<g transform="translate(70 620)"><circle class="actor" cx="67" cy="24" r="18"/><path class="actor" d="M67 42v64M34 67h66M67 106l-28 44M67 106l28 44"/><text class="role" x="67" y="180" text-anchor="middle">Registered Visitor</text></g>
<g transform="translate(1390 260)"><circle class="actor" cx="55" cy="24" r="18"/><path class="actor" d="M55 42v64M22 67h66M55 106l-28 44M55 106l28 44"/><text class="role" x="55" y="180" text-anchor="middle">Club</text><text class="role" x="55" y="203" text-anchor="middle">Administrator</text></g>
<g transform="translate(1380 680)"><circle class="actor" cx="65" cy="24" r="18"/><path class="actor" d="M65 42v64M32 67h66M65 106l-28 44M65 106l28 44"/><text class="role" x="65" y="180" text-anchor="middle">System</text><text class="role" x="65" y="203" text-anchor="middle">Administrator</text></g>

<!-- visitor use cases -->
<ellipse class="uc" cx="430" cy="230" rx="125" ry="42"/><text class="label" x="430" y="236" text-anchor="middle">Browse clubs</text>
<ellipse class="uc" cx="700" cy="230" rx="150" ry="42"/><text class="label" x="700" y="224" text-anchor="middle">View club and</text><text class="label" x="700" y="247" text-anchor="middle">station details</text>
<ellipse class="uc" cx="1015" cy="230" rx="150" ry="42"/><text class="label" x="1015" y="236" text-anchor="middle">Check availability</text>
<ellipse class="uc" cx="430" cy="345" rx="145" ry="42"/><text class="label" x="430" y="351" text-anchor="middle">View event calendar</text>
<ellipse class="uc" cx="700" cy="345" rx="130" ry="42"/><text class="label" x="700" y="351" text-anchor="middle">Register / sign in</text>
<ellipse class="uc" cx="1015" cy="345" rx="145" ry="42"/><text class="label" x="1015" y="351" text-anchor="middle">Create reservation</text>
<ellipse class="uc" cx="430" cy="470" rx="155" ry="42"/><text class="label" x="430" y="464" text-anchor="middle">Select date, time,</text><text class="label" x="430" y="487" text-anchor="middle">and station</text>
<ellipse class="uc" cx="700" cy="470" rx="160" ry="42"/><text class="label" x="700" y="476" text-anchor="middle">Revalidate availability</text>
<ellipse class="uc" cx="1015" cy="470" rx="155" ry="42"/><text class="label" x="1015" y="464" text-anchor="middle">Resolve booking</text><text class="label" x="1015" y="487" text-anchor="middle">conflict</text>
<ellipse class="uc" cx="460" cy="585" rx="165" ry="42"/><text class="label" x="460" y="591" text-anchor="middle">View own reservations</text>
<ellipse class="uc" cx="820" cy="585" rx="170" ry="42"/><text class="label" x="820" y="591" text-anchor="middle">Cancel own reservation</text>

<!-- admin use cases -->
<ellipse class="admin" cx="1120" cy="585" rx="155" ry="42"/><text class="label" x="1120" y="591" text-anchor="middle">Manage assigned club</text>
<ellipse class="admin" cx="420" cy="720" rx="135" ry="42"/><text class="label" x="420" y="726" text-anchor="middle">Manage stations</text>
<ellipse class="admin" cx="700" cy="720" rx="165" ry="42"/><text class="label" x="700" y="726" text-anchor="middle">Manage schedule</text>
<ellipse class="admin" cx="1030" cy="720" rx="175" ry="42"/><text class="label" x="1030" y="714" text-anchor="middle">Manage unavailable</text><text class="label" x="1030" y="737" text-anchor="middle">intervals</text>
<ellipse class="admin" cx="420" cy="830" rx="155" ry="42"/><text class="label" x="420" y="836" text-anchor="middle">Manage reservations</text>
<ellipse class="admin" cx="710" cy="830" rx="145" ry="42"/><text class="label" x="710" y="836" text-anchor="middle">Manage events</text>
<ellipse class="admin" cx="1010" cy="830" rx="135" ry="42"/><text class="label" x="1010" y="836" text-anchor="middle">View reports</text>
<ellipse class="admin" cx="1160" cy="905" rx="120" ry="36"/><text class="label" x="1160" y="911" text-anchor="middle">Manage clubs</text>
<ellipse class="admin" cx="820" cy="910" rx="175" ry="36"/><text class="label" x="820" y="916" text-anchor="middle">Assign administrators</text>

<!-- actor associations -->
<path class="line" d="M170 300L305 240M170 310L550 235M170 320L865 235M170 330L285 345M170 340L570 345"/>
<path class="line" d="M170 690L305 245M170 700L550 245M170 710L865 245M170 720L285 345M170 730L870 345M170 740L295 585M170 750L650 585"/>
<path class="line" d="M1390 345L1275 585"/><path class="line" d="M1380 760L1280 905M1380 770L995 910"/>

<!-- include and extend relationships -->
<path class="dash" d="M900 375L555 445" marker-end="url(#arrow)"/><text class="tiny" x="700" y="402">&lt;&lt;include&gt;&gt;</text>
<path class="dash" d="M960 385L790 440" marker-end="url(#arrow)"/><text class="tiny" x="835" y="410">&lt;&lt;include&gt;&gt;</text>
<path class="dash" d="M885 470L880 470" marker-end="url(#arrow)"/><text class="tiny" x="875" y="450" text-anchor="middle">&lt;&lt;extend&gt;&gt; when station becomes unavailable</text>
<path class="dash" d="M1010 620L545 700" marker-end="url(#arrow)"/><path class="dash" d="M1080 625L815 690" marker-end="url(#arrow)"/><path class="dash" d="M1135 627L1060 677" marker-end="url(#arrow)"/><path class="dash" d="M1085 620L520 806" marker-end="url(#arrow)"/><path class="dash" d="M1130 625L800 803" marker-end="url(#arrow)"/><path class="dash" d="M1160 627L1050 790" marker-end="url(#arrow)"/><text class="tiny" x="870" y="660">&lt;&lt;include&gt;&gt; assigned-club operations</text>

<rect x="280" y="925" width="410" height="45" rx="10" fill="#eef2ff"/><text class="small" x="300" y="953">Visitors access only their own reservations.</text>
<rect x="700" y="925" width="430" height="45" rx="10" fill="#e9f8f0"/><text class="small" x="720" y="953">Club administrators access only assigned clubs.</text>
</svg>
